<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e15" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b24" />
      <stop offset="100%" stop-color="#e05307" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ff6b18" stroke-width="4" stroke-opacity="0.35" />
  
  <!-- Subtle Industrial Grid Circuit Lines -->
  <path d="M 64 256 H 180 M 332 256 H 448 M 256 64 V 180 M 256 332 V 448" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Iconic ECHODESK 'E' Monogram in Vibrant Safety Amber -->
  <g filter="url(#glow)">
    <rect x="144" y="136" width="56" height="240" rx="14" fill="url(#primary)" />
    <rect x="144" y="136" width="224" height="54" rx="14" fill="url(#primary)" />
    <rect x="144" y="230" width="168" height="52" rx="13" fill="url(#primary)" />
    <rect x="144" y="322" width="224" height="54" rx="14" fill="url(#primary)" />
  </g>
</svg>
